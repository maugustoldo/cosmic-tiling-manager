[package]
name = "tiling-assistant"
version = "1.1.1"
edition = "2024"
description = "Manage COSMIC tiling exceptions"
license = "MIT"

[dependencies]
libcosmic = { git = "https://github.com/pop-os/libcosmic.git" }
ron = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"
wayland-client = "0.31.15"
wayland-protocols = { version = "0.32.13", features = ["staging", "client"] }

[package.metadata.deb]
maintainer = "Author <author@example.com>"
copyright = "2024"
license-file = []
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    ["target/release/tiling-assistant", "usr/bin/", "755"],
    ["data/io.github.maugustoldo.TilingAssistant.desktop", "usr/share/applications/", "644"],
    ["data/io.github.maugustoldo.TilingAssistant.svg", "usr/share/icons/hicolor/scalable/apps/", "644"]
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/tiling-assistant", dest = "/usr/bin/tiling-assistant", mode = "755" },
    { source = "data/io.github.maugustoldo.TilingAssistant.desktop", dest = "/usr/share/applications/io.github.maugustoldo.TilingAssistant.desktop", mode = "644" },
    { source = "data/io.github.maugustoldo.TilingAssistant.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.github.maugustoldo.TilingAssistant.svg", mode = "644" }
]
